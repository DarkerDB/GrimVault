<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="robots" content="noindex">
   <title>Signed in — GrimVault</title>
   <style>
      :root {
         --bg:           #060606;
         --panel:        rgba (12, 12, 12, 0.92);
         --panel-border: rgba (255, 255, 255, 0.08);
         --tan:          #ffce79;
         --tan-light:    #ffdb9d;
         --oak:          #885e44;
         --chalk:        #ecd99a;
         --muted:        rgba (255, 255, 255, 0.55);
         --text:         rgba (255, 255, 255, 0.92);
      }

      * { box-sizing: border-box; }

      html, body {
         margin: 0;
         padding: 0;
         height: 100%;
         background: #000;
         color: var (--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased;
      }

      body {
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 1.5rem;
         background:
            radial-gradient (ellipse at top, rgba (255, 206, 121, 0.05), transparent 60%),
            radial-gradient (ellipse at bottom, rgba (136, 94, 68, 0.05), transparent 60%),
            #060606;
      }

      .header {
         position: fixed;
         top: 0;
         left: 0;
         right: 0;
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 1.25rem 1.5rem;
         border-bottom: 1px solid rgba (255, 255, 255, 0.04);
         background: rgba (0, 0, 0, 0.6);
         backdrop-filter: blur (6px);
      }

      .brand {
         font-size: 0.95rem;
         font-weight: 700;
         letter-spacing: 0.08em;
         text-transform: uppercase;
         color: var (--chalk);
         text-decoration: none;
      }

      .brand .dot {
         display: inline-block;
         width: 6px;
         height: 6px;
         border-radius: 50%;
         margin: 0 0.6em;
         background: var (--tan);
         vertical-align: middle;
         box-shadow: 0 0 10px var (--tan);
      }

      .card {
         position: relative;
         max-width: 440px;
         width: 100%;
         padding: 3rem 2.25rem 2.5rem;
         text-align: center;
         background: var (--panel);
         border: 1px solid var (--panel-border);
         border-radius: 6px;
         box-shadow:
            0 0 0 1px rgba (255, 255, 255, 0.02),
            0 20px 60px rgba (0, 0, 0, 0.6),
            inset 0 0 40px rgba (0, 0, 0, 0.5);
      }

      .logo {
         margin: 0 auto 1.25rem;
         width: 64px;
         height: 64px;
         border-radius: 50%;
         display: flex;
         align-items: center;
         justify-content: center;
         background:
            radial-gradient (circle at 30% 30%, rgba (255, 219, 157, 0.3), transparent 60%),
            linear-gradient (135deg, #2a1c10, #0a0604);
         border: 1px solid rgba (255, 206, 121, 0.25);
         box-shadow:
            0 0 30px rgba (255, 206, 121, 0.15),
            inset 0 0 12px rgba (0, 0, 0, 0.6);
      }

      .logo svg {
         width: 32px;
         height: 32px;
         fill: var (--tan);
         filter: drop-shadow (0 0 4px rgba (255, 206, 121, 0.4));
      }

      .check {
         display: inline-flex;
         align-items: center;
         justify-content: center;
         margin-bottom: 1.5rem;
         width: 40px;
         height: 40px;
         border-radius: 50%;
         background: rgba (128, 214, 0, 0.12);
         border: 1px solid rgba (128, 214, 0, 0.3);
      }

      .check svg {
         width: 20px;
         height: 20px;
         stroke: #a8e83f;
         stroke-width: 3;
         fill: none;
         stroke-linecap: round;
         stroke-linejoin: round;
      }

      h1 {
         margin: 0 0 0.6rem;
         font-size: 1.4rem;
         font-weight: 700;
         color: #fff;
         letter-spacing: 0.01em;
      }

      p {
         margin: 0;
         font-size: 0.95rem;
         line-height: 1.55;
         color: var (--muted);
      }

      .product {
         display: inline-block;
         margin-top: 1.5rem;
         padding: 0.3rem 0.75rem;
         font-size: 0.75rem;
         font-weight: 600;
         letter-spacing: 0.1em;
         text-transform: uppercase;
         color: var (--tan-light);
         border: 1px solid rgba (255, 206, 121, 0.2);
         border-radius: 999px;
         background: rgba (255, 206, 121, 0.04);
      }

      .footnote {
         margin-top: 2rem;
         padding-top: 1.5rem;
         border-top: 1px solid rgba (255, 255, 255, 0.04);
         font-size: 0.78rem;
         color: rgba (255, 255, 255, 0.3);
      }

      @media (prefers-reduced-motion: no-preference) {
         .check {
            animation: pulse 2.4s ease-in-out infinite;
         }

         @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba (168, 232, 63, 0.0); }
            50%      { box-shadow: 0 0 0 8px rgba (168, 232, 63, 0.08); }
         }
      }
   </style>
</head>
<body>
   <div class="header">
      <span class="brand">Darker<span class="dot"></span>DB</span>
   </div>

   <main class="card" role="main">
      <div class="logo" aria-hidden="true">
         <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2 L3 6 v6 c0 5 3.5 8.5 9 10 5.5-1.5 9-5 9-10 V6 z" />
         </svg>
      </div>

      <div class="check" aria-hidden="true">
         <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <polyline points="5 12 10 17 19 7" />
         </svg>
      </div>

      <h1>Signed in</h1>
      <p>You can close this tab and return to the game.</p>

      <span class="product">GrimVault Desktop</span>

      <div class="footnote">
         DarkerDB &middot; Dark and Darker market data
      </div>
   </main>
</body>
</html>
