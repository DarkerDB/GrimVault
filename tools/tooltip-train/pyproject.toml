[project]
name = "grimvault-tooltip-train"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "loguru==0.7.3",
  "ninja==1.13.0",
  "numpy==1.26.4",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "onnxsim==0.4.36",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.3.0",
  "pycocotools==2.0.10",
  "scikit-image==0.25.2",
  "tabulate==0.9.0",
  "tensorboard==2.20.0",
  "thop==0.1.1.post2209072238",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm==4.67.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
